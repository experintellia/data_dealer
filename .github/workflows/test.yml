name: Tests

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Type-check (tsc --noEmit)
        run: pnpm typecheck

      - name: Build both variants (HQ + casual)
        # Casual variant assets are pre-quantized in img-casual/ and
        # icon-casual.png; CI does not need pngquant/oxipng installed.
        # See README.md "Bundle variants" and `pnpm quantize-assets`.
        run: pnpm build:all

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Get .xdc bundle info
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        id: xdc_info
        run: |
          HQ_SIZE=$(du -h data-dealer-hq.xdc | cut -f1)
          HQ_COUNT=$(unzip -l data-dealer-hq.xdc | tail -1 | awk '{print $2}')
          CASUAL_SIZE=$(du -h data-dealer-casual.xdc | cut -f1)
          CASUAL_COUNT=$(unzip -l data-dealer-casual.xdc | tail -1 | awk '{print $2}')
          {
            echo "hq_size=$HQ_SIZE"
            echo "hq_count=$HQ_COUNT"
            echo "casual_size=$CASUAL_SIZE"
            echo "casual_count=$CASUAL_COUNT"
          } >> "$GITHUB_OUTPUT"

      - name: Upload HQ .xdc artifact
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        id: upload_xdc_hq
        uses: actions/upload-artifact@v4
        with:
          name: data-dealer-hq-xdc
          path: data-dealer-hq.xdc
          retention-days: 30

      - name: Upload casual .xdc artifact
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        id: upload_xdc_casual
        uses: actions/upload-artifact@v4
        with:
          name: data-dealer-casual-xdc
          path: data-dealer-casual.xdc
          retention-days: 30

      - name: Post sticky PR comment with artifact links
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: xdc-artifact
          message: |
            ## webxdc build ready — two variants

            | Variant | Size | Files | Download |
            |---|---|---|---|
            | **Casual** (recommended for casual play) | ${{ steps.xdc_info.outputs.casual_size }} | ${{ steps.xdc_info.outputs.casual_count }} | [data-dealer-casual.xdc](${{ steps.upload_xdc_casual.outputs.artifact-url }}) |
            | **HQ** (full-quality sprites) | ${{ steps.xdc_info.outputs.hq_size }} | ${{ steps.xdc_info.outputs.hq_count }} | [data-dealer-hq.xdc](${{ steps.upload_xdc_hq.outputs.artifact-url }}) |

            Both bundles are functionally identical. The casual variant
            quantizes sprite atlases to a 256-color palette (visually
            indistinguishable on cartoon art) for ~60% smaller bundle.
            Drop either file into Delta Chat to test.

  playwright:
    name: Playwright e2e tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      # Ensure the Chromium binary (and its system deps) is present.
      # In this CI environment PLAYWRIGHT_BROWSERS_PATH points to a pre-populated
      # directory, so this is normally a no-op; on a clean runner it downloads
      # the required revision.
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright e2e tests
        run: pnpm test:e2e

      - name: Upload Playwright traces and screenshots on failure
        if: failure()
        id: upload_pw_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Post sticky PR comment with Playwright artifact link
        if: failure() && github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: playwright-failure
          message: |
            ## ❌ Playwright e2e tests failed

            Traces and screenshots are attached to this run.

            [Download playwright-report](${{ steps.upload_pw_artifacts.outputs.artifact-url }})

  release:
    name: Attach .xdc to GitHub Release
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download HQ .xdc artifact
        uses: actions/download-artifact@v4
        with:
          name: data-dealer-hq-xdc

      - name: Download casual .xdc artifact
        uses: actions/download-artifact@v4
        with:
          name: data-dealer-casual-xdc

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            data-dealer-hq.xdc
            data-dealer-casual.xdc
