name: Tests

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm build

      - name: Run tests with coverage
        run: pnpm test:coverage

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

      - name: Get .xdc bundle info
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        id: xdc_info
        run: |
          SIZE=$(du -sh data-dealer.xdc | cut -f1)
          COUNT=$(unzip -l data-dealer.xdc | tail -1 | awk '{print $2}')
          echo "size=$SIZE" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: Upload .xdc artifact
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        id: upload_xdc
        uses: actions/upload-artifact@v4
        with:
          name: data-dealer-xdc
          path: data-dealer.xdc
          retention-days: 30

      - name: Post sticky PR comment with artifact link
        if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: xdc-artifact
          message: |
            ## webxdc build ready

            **Bundle:** `data-dealer.xdc` — ${{ steps.xdc_info.outputs.size }} / ${{ steps.xdc_info.outputs.count }} files

            [Download data-dealer.xdc](${{ steps.upload_xdc.outputs.artifact-url }})

            Drop the downloaded file into Delta Chat to test.

  release:
    name: Attach .xdc to GitHub Release
    needs: [test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Download .xdc artifact
        uses: actions/download-artifact@v4
        with:
          name: data-dealer-xdc

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: data-dealer.xdc
