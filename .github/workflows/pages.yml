name: Deploy to GitHub Pages

# Standalone playable build (no messenger): dist-pages/ plus the webxdc stub
# from @webxdc/vite-plugins, so the game runs in a plain browser tab.  HQ
# variant — lossless sprites; the web has no bundle-size ceiling to respect
# and Pages serves the atlases compressed and cached.
#
# Requires Settings → Pages → Source = "GitHub Actions" (one-time).

on:
  # Deploy only what the Tests workflow passed on master.
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    # `branches` above also matches a fork PR whose head branch is called
    # master, so require a push run.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4
        with:
          # The commit Tests ran on, not the branch tip (empty on dispatch).
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build static site
        run: pnpm build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

      - id: deployment
        uses: actions/deploy-pages@v4
