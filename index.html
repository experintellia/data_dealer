<!DOCTYPE html>

<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-type" content="text/html; charset=utf-8" />
    <!-- FIXME: The following two lines are invalid HTML5; cache manifest needed? -->
    <meta http-equiv="expires" content="0">
    <meta http-equiv="pragma" content="nocache">

    <meta name="description" content="Jetzt die Seiten wechseln! Werde zum Data Dealer und sammle alle privaten Details über Freunde, Nachbarn, Bekannte &amp; den Rest der Welt." />
    <meta name="format-detection" content="telephone=no">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">


    <meta property="og:title" content="Data Dealer. Legal, illegal, scheißegal!" />
    <meta property="og:description" content="Jetzt die Seiten wechseln! Werde zum Data Dealer und sammle alle privaten Details über Freunde, Nachbarn, Bekannte &amp; den Rest der Welt." />
    <!-- FIXME <meta property="og:image" content="http://www.datadealer.net/img/screenshot.jpg" /> -->
    <meta property="og:site_name" content="Data Dealer" />
    <meta property="og:locale" content="de_DE" />
    <meta property="og:url" content="https://beta.datadealer.com" />
    <meta property="og:type" content="website" />

    <meta name="mobile-web-app-capable" content="yes">
    <!--<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />-->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <!-- FIXME <link rel="apple-touch-icon" href="img/icon-profile_s1.png"/> -->
    <!-- <link rel="apple-touch-startup-image" href="img/agent-manni-logo.png"> -->

    <link rel="stylesheet" type="text/css" href="./css/dd.css">
    <link rel="stylesheet" type="text/css" href="./css/Render.css">
    <link rel="stylesheet" type="text/css" href="./css/Statusbar.css">
    <link rel="stylesheet" type="text/css" href="./css/MainMenu.css">

    <!-- dev: served by mockWebxdc() Vite plugin; prod: injected by the messenger -->
    <script src="webxdc.js"></script>

    <!-- Vendor libraries: each sets the browser globals our ESM bundle
         reads ($, numeral, sprintf, createjs, core, Scroller).  Order
         matters: dependents come after their providers. -->
    <script src="vendor/jquery.js"></script>
    <script src="vendor/jquery-migrate.js"></script>
    <script src="vendor/numeral.js"></script>
    <script src="vendor/numeral-de.js"></script>
    <script src="vendor/sprintf.js"></script>
    <script src="vendor/easeljs.js"></script>
    <script src="vendor/tweenjs.js"></script>
    <script src="vendor/soundjs.js"></script>
    <script src="vendor/zynga-animate.js"></script>
    <script src="vendor/zynga-scroller.js"></script>

    <!-- Defer so #dd-control is in the DOM by the time bootstrap.js
         renders the loader into it. -->
    <script defer src="scripts/esm-bundle.js"></script>

    <title>Data Dealer</title>
  </head>
  <body>
    <!-- The game mounts into #dd-control rather than <body> so siblings
         appended to <body> (e.g. the webxdc-dev simulator overlay) are
         not wiped out when app.start renders game.html. -->
    <div id='dd-control' style='width:100%;height:100%;'></div>
  </body>
</html>
